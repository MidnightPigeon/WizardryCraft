[interface]
	autoCollapseNavigation = true
	rememberEditingMode = true
	rememberViewport = true
	#GUI pixels; 0 selects automatic width.
	# Default: 0
	# Range: 0 ~ 400
	navigationWidth = 0
	#GUI pixels; 0 selects automatic width.
	# Default: 0
	# Range: 0 ~ 600
	detailsWidth = 0
	#Allowed Values: ALWAYS, EDITING_ONLY, NEVER
	showGrid = "ALWAYS"
	#Always show visible quest names above or below their nodes; OFF hides labels.
	#Allowed Values: OFF, ABOVE, BELOW
	questNamePosition = "OFF"
	#Show completed / visible quests and percentage in chapter navigation.
	showChapterProgress = false

#Quest editor preferences
[editor]
	#Captured when a node press begins.
	# Default: 220
	# Range: 100 ~ 1000
	nodeDragHoldMillis = 220
	#Snap dragged quest nodes to the grid. Applies to the next drag.
	snapToGrid = true

#Quest screen scrolling settings
[scrolling]
	#Pixels added to the target for one mouse-wheel notch.
	# Default: 24.0
	# Range: 1.0 ~ 100.0
	scrollStep = 24.0
	#Scroll response per second. Higher values reach the target faster.
	# Default: 12.0
	# Range: 1.0 ~ 40.0
	smoothSpeed = 12.0

#Quest screen animation settings
[animations]
	reduceMotion = false
	# Default: 0.1
	# Range: 0.01 ~ 0.5
	zoomStep = 0.1
	#Zoom response per second.
	# Default: 12.0
	# Range: 1.0 ~ 40.0
	zoomSmoothSpeed = 12.0
	#Left and right drawer response per second.
	# Default: 14.0
	# Range: 1.0 ~ 40.0
	drawerSmoothSpeed = 14.0
	#Selected-quest camera focus response per second.
	# Default: 10.0
	# Range: 1.0 ~ 40.0
	focusSmoothSpeed = 10.0
	#Centers a quest in the remaining canvas when its details are opened or switched.
	autoFocusSelectedQuest = true

#Tracked quest HUD
[trackingHud]
	#Tracking HUD scale relative to GUI pixels; default 0.75.
	# Default: 0.75
	# Range: 0.5 ~ 1.5
	hudScale = 0.75
	#Tracking HUD background opacity from 0 to 1; text and icons remain opaque.
	# Default: 0.85
	# Range: 0.0 ~ 1.0
	hudBackgroundOpacity = 0.85
	#Maximum tracking HUD width before its independent scale; actual width follows content.
	# Default: 240
	# Range: 120 ~ 400
	hudMaxWidth = 240

#Top-center completion notifications
[notifications]
	completionNotifications = true
	notificationSound = false
	#Floating notification scale relative to GUI pixels.
	# Default: 1.0
	# Range: 0.5 ~ 1.5
	notificationScale = 1.0
	#Notification background opacity from 0 to 1; text and icons remain opaque.
	# Default: 1.0
	# Range: 0.0 ~ 1.0
	notificationBackgroundOpacity = 1.0
	#Floating notification width in GUI pixels before notification scaling.
	# Default: 280
	# Range: 160 ~ 600
	notificationWidth = 280
	#Seconds from the latest notification until the entire stack closes together.
	# Default: 4.0
	# Range: 1.0 ~ 30.0
	notificationDurationSeconds = 4.0

#Client development diagnostics
[debug]
	#Replace BRNQuest text tooltips with text layout measurements.
	textLayoutDebug = false
