[guide]
	#Give the guide once when a player first joins this world. Does not replace held items.
	giveOnFirstJoin = true

	[rendering.crystalBall]
		#1 = roaming light motes; 2 = roaming miniature stored items (default).
		#One display per occupied slot. Empty balls display no contents. This is a local visual preference.
		# Default: 2
		# Range: 1 ~ 2
		displayMode = 2

	[spells.reload]
		#Block IDs excluded as both reload targets and random results. Server-side rules; restart after editing.
		blockBlacklist = ["minecraft:bedrock", "omnira:pure_solidified_spacetime", "create:wooden_bracket", "create:copycat_base", "create:metal_bracket", "create:water_wheel_structure", "create:copycat_bars", "minecraft:frosted_ice", "omnira:permanent_reinforced_void_crystal"]
		#Entity type IDs excluded as both reload targets and random results. Does not affect World Rotation.
		entityBlacklist = ["minecraft:ender_dragon"]
